name: Nika demo browser tests
on:
  pull_request:
  push:
    branches: [main, feat/nika-demo-v2]
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:account && npm run test:account && node tests/password.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node tests/responsive.cjs
      - run: node tests/registration.cjs
      - run: node tests/multi-pet.cjs
      - run: node tests/account-browser.cjs
      - run: node tests/password-browser.cjs
      - run: node tests/pet-photo.cjs
      - run: node tests/gps.cjs && node tests/family.cjs
      - run: node tests/gps-browser.cjs
      - run: node tests/family-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nika-browser-evidence
          path: evidence/
