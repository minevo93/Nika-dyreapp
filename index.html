<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nika – Dyreappen</title><style>
:root{font-family:system-ui,sans-serif;color:#193d30;background:#f6f7f1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#d9e9d9,transparent 45%),#f7f8f3}button,input,select{font:inherit}button{cursor:pointer}header{max-width:1200px;margin:auto;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.logo{font-size:26px;font-weight:900}nav{display:flex;gap:5px;flex-wrap:wrap}nav button{border:0;background:#fff9;padding:9px 12px;border-radius:20px;color:#245c46}main{max-width:1200px;margin:auto;padding:12px 22px 60px}.hero{display:grid;grid-template-columns:1fr 1.15fr .75fr;gap:18px;align-items:center;min-height:420px}h1{font: bold clamp(39px,5vw,68px)/1.05 Georgia,serif;margin:0 0 16px}.muted{color:#60786b}.card,.chat,.dog{background:#fffe;border:1px solid #fff;border-radius:25px;box-shadow:0 15px 40px #1a553017;padding:20px}.chat{min-height:370px;display:flex;flex-direction:column}.msgs{flex:1;display:flex;flex-direction:column;gap:10px;max-height:270px;overflow:auto;margin:18px 0}.bubble{background:#edf2ec;border-radius:17px;padding:12px;max-width:90%;white-space:pre-wrap}.mine{align-self:flex-end;background:#cce8d6}.send{display:flex;gap:8px}.send input{flex:1;min-width:0}.send input,input,select{border:1px solid #d5e4d9;border-radius:12px;padding:12px;background:#fff}.btn{border:0;border-radius:13px;padding:12px 15px;background:#236e53;color:white;font-weight:750}.btn:hover{filter:brightness(1.12)}.light{background:#e5f1e8;color:#19573f}.dog{display:grid;place-items:center;min-height:330px;background:radial-gradient(circle,#fff,#d6e7d4);font-size:135px;animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}.actions,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:20px}.actions button{min-height:65px;border:0;border-radius:20px;background:#d8ebdf;color:#1a573f;font-weight:800;box-shadow:0 10px 25px #16472e18}.actions button:first-child{background:#226d53;color:#fff}.actions button:nth-child(2){background:#f5dfc8}.actions button:nth-child(3){background:#d6e9fc}.card h3{margin:0 0 15px}.item{padding:9px 0;border-bottom:1px solid #e7ede8}.item:last-child{border:0}.panel{margin-top:18px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{width:100%}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.note{font-size:12px;color:#687e71}.hidden{display:none}.welcome{color:#477660;font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:12px}@media(max-width:950px){.hero{grid-template-columns:1fr 1.2fr}.dog{display:none}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.hero{display:block}.chat{margin-top:24px}.grid,.actions{grid-template-columns:1fr 1fr}.card{padding:15px}nav{overflow:auto;flex-wrap:nowrap;width:100%}nav button{white-space:nowrap}.actions button{font-size:13px}}footer{text-align:center;padding:30px;color:#769080;font-size:12px}
</style><header><div class="logo">🐾 Nika <small style="font-size:12px;font-weight:400">Dyreappen</small></div><nav id="nav"><button data-go="home">Hjem</button><button data-go="profile">Min hund</button><button data-go="walks">Turer</button><button data-go="meals">Måltider</button><button data-go="family">Familie</button><button data-go="qr">QR-ID</button><button data-go="shop">Butikk</button></nav></header><main><div class="hero"><div><div class="welcome">Din hund. Din familie. Deres hverdag.</div><h1>Et bedre liv sammen ♡</h1><p class="muted">En varm og enkel hverdag for deg, hunden din og hele familien.</p><p>🐾 Mer tid sammen &nbsp; ♡ Bedre oversikt</p></div><section class="chat"><b>🐾 Nika <span class="note">· Din hundeassistent</span></b><div class="msgs" id="msgs" aria-live="polite"></div><form class="send" id="chat"><input id="message" required maxlength="90" placeholder="Skriv her..." aria-label="Skriv til Nika"><button class="btn">➜</button></form></section><div class="dog">🐕</div></div><div id="workspace" class="hidden"><div class="actions"><button data-go="walks">🐾 Start luftetur</button><button data-go="meals">🥣 Planlegg måltid</button><button data-go="profile">👤 Åpne profil</button><button data-go="qr">▦ QR-ID</button></div><div class="panel" id="panel"></div></div></main><footer>Nika Dyreappen · MVP-demo · Data lagres kun i denne nettleseren</footer><script>
const K='nika-mvp-v1';let d={dog:null,walks:[],meals:[],family:[],active:null,contact:''};try{d={...d,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){}let step=0,page='home',messages=[];const $=id=>document.getElementById(id),save=()=>localStorage.setItem(K,JSON.stringify(d)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),now=()=>new Date().toLocaleString('no-NO'),card=(title,body)=>'<article class="card"><h3>'+title+'</h3>'+body+'</article>',btn=(label,action)=>'<button class="btn light" data-action="'+action+'">'+label+'</button>',item=(text)=>'<div class="item">'+text+'</div>';function say(text,mine=false){messages.push({text,mine});$('msgs').innerHTML=messages.map(m=>'<div class="bubble '+(m.mine?'mine':'')+'">'+esc(m.text)+'</div>').join('');$('msgs').scrollTop=$('msgs').scrollHeight}function prompt(){say(['Hei! 🐾 Hva heter hunden din?','Så fint! Hvilken rase er hunden?','Hvor gammel er hunden? Skriv for eksempel 3 år.'][step])}if(d.dog)say('Velkommen tilbake! Hvordan går det med '+d.dog.name+' i dag?');else prompt();$('chat').onsubmit=e=>{e.preventDefault();const x=$('message'),v=x.value.trim();if(!v)return;x.value='';say(v,true);if(!d.dog){if(step===0){d.name=v;step++;prompt()}else if(step===1){d.breed=v;step++;prompt()}else{d.dog={name:d.name,breed:d.breed,age:v,sex:'Ikke oppgitt'};delete d.name;delete d.breed;save();say('Så hyggelig! 🐾 Profilen er klar. Velkommen inn i Nika!');render()}}else{say('Jeg er en enkel demoassistent. Bruk knappene under for turer, måltider, familie og profil.')}};function render(){if(!d.dog)return;$('workspace').classList.remove('hidden');const n=esc(d.dog.name),last=d.walks.at(-1);let body='';if(page==='home'){body='<div class="grid">'+card('🐾 '+n+' sin profil',item('Rase: '+esc(d.dog.breed))+item('Alder: '+esc(d.dog.age))+item('Kjønn: '+esc(d.dog.sex))+btn('Rediger profil','profile'))+card('🌿 Siste tur',last?item(esc(last.date))+item(last.minutes+' minutter · 💧 '+last.pee+' · 💩 '+last.poop):'<p class="muted">Ingen turer registrert ennå.</p>')+card('🥣 Måltider',item(d.meals.length+' måltider planlagt')+btn('Åpne måltider','meals'))+card('👥 Familie',item(d.family.length+' familiemedlemmer')+btn('Åpne familien','family'))+'</div>'}if(page==='profile'){body=card('🐾 Profilen til '+n,'<label class="field">Navn<input id="dogName" value="'+n+'"></label><label class="field">Rase<input id="dogBreed" value="'+esc(d.dog.breed)+'"></label><label class="field">Alder<input id="dogAge" value="'+esc(d.dog.age)+'"></label><label class="field">Kjønn<select id="dogSex"><option>Ikke oppgitt</option><option>Hann</option><option>Hunn</option></select></label><button class="btn" data-action="saveprofile">Lagre profil</button>')}if(page==='walks'){body=card('🌿 Lufteturer',d.active?'<p>Tur startet: '+esc(d.active.date)+'</p><div class="row">'+btn('💧 Tisset','pee')+btn('💩 Bæsjet','poop')+btn('Avslutt tur','endwalk')+'</div><p class="note">Demoen registrerer varighet og hendelser, men ikke GPS-rute.</p>':btn('🐾 Start ny luftetur','startwalk'))+'<div style="margin-top:15px">'+card('Turhistorikk',d.walks.length?d.walks.slice().reverse().map(w=>item(esc(w.date)+' · '+w.minutes+' min · 💧 '+w.pee+' · 💩 '+w.poop)).join(''):'<p class="muted">Ingen turer ennå.</p>')+'</div>'}if(page==='meals'){body=card('🥣 Måltidsplan','<form id="mealForm"><label class="field">Tidspunkt<input type="time" id="mealTime" required value="17:00"></label><label class="field">Fôr / beskrivelse<input id="mealFood" required maxlength="100" placeholder="F.eks. tørrfôr"></label><button class="btn">Legg til måltid</button></form><p class="note">Porsjoner må følge hundens individuelle fôrplan.</p>')+'<div style="margin-top:15px">'+card('Planlagte måltider',d.meals.map((m,i)=>item(esc(m.time)+' · '+esc(m.food)+' · '+(m.done?'Gitt':'Planlagt')+' '+btn(m.done?'Angre':'Marker gitt','meal:'+i))).join('')||'Ingen måltider planlagt.')+'</div>'}if(page==='family'){body=card('👥 Familien','<form id="familyForm"><label class="field">Navn<input id="member" maxlength="70" required placeholder="Navn på familiemedlem"></label><button class="btn">Legg til</button></form>')+'<div style="margin-top:15px">'+card('Familiemedlemmer',d.family.map((m,i)=>item(esc(m)+' '+btn('Fjern','remove:'+i))).join('')||'Ingen lagt til ennå.')+'</div>'}if(page==='qr'){body=card('▦ QR-ID og kontakt','<p>Registrer kontaktinformasjon som senere kan vises på en offentlig finner-side.</p><label class="field">Kontakttelefon<input id="contact" type="tel" value="'+esc(d.contact)+'" placeholder="Telefonnummer"></label><button class="btn" data-action="savecontact">Lagre kontakt</button><p class="note">Viktig: Dette er kun en lokal prototype. QR-brikke, offentlig oppslag og posisjonssporing er ikke aktivert. Ikke del private kontaktopplysninger via denne demoen.</p>')}if(page==='shop'){body=card('🛍 Fôr og utstyr','<p>Her planlegger vi sammenligning av hundefôr, utstyr, butikker og priser.</p><p class="note">Ingen produkter eller priser er hentet inn i denne versjonen.</p>')} $('panel').innerHTML=body;const sex=$('dogSex');if(sex)sex.value=d.dog.sex;const mf=$('mealForm');if(mf)mf.onsubmit=e=>{e.preventDefault();d.meals.push({time:$('mealTime').value,food:$('mealFood').value.trim(),done:false});save();render()};const ff=$('familyForm');if(ff)ff.onsubmit=e=>{e.preventDefault();d.family.push($('member').value.trim());save();render()}}function go(p){if(!d.dog){$('message').focus();return}page=p;render();$('panel').scrollIntoView({behavior:'smooth',block:'nearest'})}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}let a=b.dataset.action;if(!a)return;if(a==='profile'){go('profile')}if(a==='meals'){go('meals')}if(a==='family'){go('family')}if(a==='saveprofile'){const name=$('dogName').value.trim(),breed=$('dogBreed').value.trim(),age=$('dogAge').value.trim();if(!name||!breed||!age)return alert('Fyll ut navn, rase og alder.');d.dog={name,breed,age,sex:$('dogSex').value};save();render()}if(a==='startwalk'){d.active={start:Date.now(),date:now(),pee:0,poop:0};save();render()}if(a==='pee'||a==='poop'){if(d.active){d.active[a]++;save();render()}}if(a==='endwalk'&&d.active){d.walks.push({...d.active,minutes:Math.max(1,Math.round((Date.now()-d.active.start)/60000))});d.active=null;save();render()}if(a==='savecontact'){d.contact=$('contact').value.trim();save();render()}if(a.startsWith('meal:')){let i=Number(a.split(':')[1]);d.meals[i].done=!d.meals[i].done;save();render()}if(a.startsWith('remove:')){let i=Number(a.split(':')[1]);d.family.splice(i,1);save();render()}});render();
</script></html>
